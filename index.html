<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        .weather-container {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
        }

        input {
            padding: 10px;
            width: 80%;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #0072ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        #weatherResult {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <h1>Weather App</h1>
        <input type="text" id="locationInput" placeholder="Enter location (e.g. London)">
        <button onclick="getWeather()">Get Weather</button>
        <div id="weatherResult"></div>
    </div>

    <script>
        function getWeather() {
            const location = document.getElementById('locationInput').value;
            const apiKey = 'bad89ee2a94349e9a9380341251404';
            const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Location not found");
                    }
                    return response.json();
                })
                .then(data => {
                    const tempC = data.current.temp_c;
                    const city = data.location.name;
                    const country = data.location.country;
                    document.getElementById('weatherResult').innerHTML = 
                        `🌍 ${city}, ${country}<br>🌡️ Temperature: ${tempC}°C`;
                })
                .catch(error => {
                    document.getElementById('weatherResult').innerHTML = `❌ ${error.message}`;
                });
        }
    </script>
</body>
</html>
